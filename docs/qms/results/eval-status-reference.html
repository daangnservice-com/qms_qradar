function caseNode(id, name, evaluated) {
  return { id, name, status: evaluated ? "evaluated" : "pending", statusLabel: evaluated ? "평가완료" : "대기" };
}
function targetNode(id, name, evaluated, cases) {
  return {
    id, name, status: evaluated ? "evaluated" : "pending", statusLabel: evaluated ? "평가완료" : "대기",
    targetCount: 1, openTargetCount: evaluated ? 0 : 1,
    caseCount: cases.length, openCaseCount: cases.filter((c) => c.status !== "evaluated").length, cases,
  };
}
function sheetNode(id, name, status, statusLabel, targets) {
  return {
    id, name, status, statusLabel, targets,
    targetCount: targets.length,
    openTargetCount: targets.filter((t) => t.status !== "evaluated").length,
    caseCount: targets.reduce((n, t) => n + t.caseCount, 0),
    openCaseCount: targets.reduce((n, t) => n + t.openCaseCount, 0),
  };
}
function rollup(sheets) {
  const openSheetCount = sheets.filter((s) => s.status !== "confirmed").length;
  return {
    targetCount: sheets.reduce((n, s) => n + s.targetCount, 0),
    openTargetCount: sheets.reduce((n, s) => n + s.openTargetCount, 0),
    caseCount: sheets.reduce((n, s) => n + s.caseCount, 0),
    openCaseCount: sheets.reduce((n, s) => n + s.openCaseCount, 0),
    sheetCount: sheets.length, openSheetCount,
    status: openSheetCount > 0 ? "open" : "confirmed",
    statusLabel: openSheetCount > 0 ? "미확정" : "확정",
  };
}
function templateNode(id, name, sheets) { return { id, name, sheets, ...rollup(sheets) }; }
function teamNode(id, name, templates) {
  return { id, name, templates, ...rollup(templates.flatMap((t) => t.sheets)) };
}
function monthPayload(month, tree, byEvalStatus) {
  const sheets = tree.flatMap((t) => t.templates.flatMap((tpl) => tpl.sheets));
  return {
    month, tree, byEvalStatus, truncated: false,
    evalCount: sheets.length,
    openEvalCount: sheets.filter((s) => s.status !== "confirmed").length,
    targetCount: tree.reduce((n, t) => n + t.targetCount, 0),
    openTargetCount: tree.reduce((n, t) => n + t.openTargetCount, 0),
    caseCount: tree.reduce((n, t) => n + t.caseCount, 0),
    openCaseCount: tree.reduce((n, t) => n + t.openCaseCount, 0),
  };
}

function filterOpenTree(tree) {
  const empty = { targetCount: 0, openTargetCount: 0, caseCount: 0, openCaseCount: 0 };
  const add = (a, b) => ({
    targetCount: a.targetCount + b.targetCount,
    openTargetCount: a.openTargetCount + b.openTargetCount,
    caseCount: a.caseCount + b.caseCount,
    openCaseCount: a.openCaseCount + b.openCaseCount,
  });
  const sheetOpen = (s) => s.status !== "confirmed" || s.openTargetCount > 0 || s.openCaseCount > 0;
  const out = [];
  for (const team of tree) {
    const templates = [];
    let teamCounts = empty;
    let sheetCount = 0;
    for (const tpl of team.templates) {
      const sheets = tpl.sheets.filter(sheetOpen);
      if (!sheets.length) continue;
      const counts = sheets.reduce(add, empty);
      templates.push({ ...tpl, sheets, ...counts, sheetCount: sheets.length, openSheetCount: sheets.length, status: "open", statusLabel: "미확정" });
      teamCounts = add(teamCounts, counts);
      sheetCount += sheets.length;
    }
    if (!templates.length) continue;
    out.push({ ...team, templates, ...teamCounts, sheetCount, openSheetCount: sheetCount, status: "open", statusLabel: "미확정" });
  }
  return out;
}

function doneStatus(status) {
  return status === "confirmed" || status === "evaluated";
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function countCell(v, warn) {
  if (v == null) return `<span class="num mute">—</span>`;
  return `<span class="num ${warn && v > 0 ? "warn" : ""}">${v}</span>`;
}
function badge(status, label) {
  return `<span class="badge ${doneStatus(status) ? "ok" : "warn"}">${esc(label || "미지정")}</span>`;
}

  const caret = toggleId ? (expanded ? "▾" : "▸") : "";
  return `<div class="row d${depth} ${clickable ? "clickable" : ""}" ${toggleId ? `data-toggle="${esc(toggleId)}"` : ""} ${activateId ? `data-case="${esc(activateId)}"` : ""}>
    <span class="name" style="padding-left:${pad}px">
      <span class="caret">${caret}</span>
      <span class="kind">${esc(kind)}</span>
      <span class="name-text">${esc(name)}</span>
    </span>
    ${badge(status, statusLabel)}
    ${countCell(targetCount)}
    ${countCell(openTargetCount, true)}
    ${countCell(caseCount)}
    ${countCell(openCaseCount, true)}
    <span class="action">${action || ""}</span>
  </div>`;
}

function renderTree(data, emptyLabel) {
  const rows = [];
  for (const team of data.tree) {
    const teamOpen = state.expanded[team.id] !== false;
    rows.push(rowHtml({ depth: 0, kind: "팀", name: team.name, status: team.status, statusLabel: team.statusLabel, targetCount: team.targetCount, openTargetCount: team.openTargetCount, caseCount: team.caseCount, openCaseCount: team.openCaseCount, toggleId: team.id, expanded: teamOpen }));
    if (!teamOpen) continue;
    for (const tpl of team.templates) {
      const tplOpen = state.expanded[tpl.id] !== false;
      rows.push(rowHtml({ depth: 1, kind: "템플릿", name: tpl.name, status: tpl.status, statusLabel: tpl.statusLabel, targetCount: tpl.targetCount, openTargetCount: tpl.openTargetCount, caseCount: tpl.caseCount, openCaseCount: tpl.openCaseCount, toggleId: tpl.id, expanded: tplOpen }));
      if (!tplOpen) continue;
      for (const sheet of tpl.sheets) {
        const sheetOpen = !!state.openSheets[sheet.id];
        const action = sheet.targets.length
          ? `<button class="ghost" type="button" data-sheet="${esc(sheet.id)}">${sheetOpen ? "접기" : `대상 ${sheet.targets.length}`}</button>`
          : "";
        rows.push(rowHtml({ depth: 2, kind: "평가표", name: sheet.name, status: sheet.status, statusLabel: sheet.statusLabel, targetCount: sheet.targetCount, openTargetCount: sheet.openTargetCount, caseCount: sheet.caseCount, openCaseCount: sheet.openCaseCount, action }));
        if (!sheetOpen) continue;
        for (const target of sheet.targets) {
          const tOpen = !!state.openTargets[target.id];
          const tAction = target.cases.length
            ? `<button class="ghost" type="button" data-target="${esc(target.id)}">${tOpen ? "접기" : `케이스 ${target.cases.length}`}</button>`
            : "";
          rows.push(rowHtml({ depth: 3, kind: "타겟", name: target.name, status: target.status, statusLabel: target.statusLabel, caseCount: target.caseCount, openCaseCount: target.openCaseCount, action: tAction }));
          if (!tOpen) continue;
          for (const c of target.cases) {
            rows.push(rowHtml({ depth: 4, kind: "케이스", name: c.name, status: c.status, statusLabel: c.statusLabel, activateId: c.id }));
          }
        }
      }
    }
  }
  const pills = (data.byEvalStatus || []).map((s) => `<span class="pill">${esc(s.label)} ${s.count}</span>`).join("");
  return `<div class="tree">
    <div class="tree-head">
      <p>팀 → 템플릿 → 평가표까지 기본으로 보여요. 평가 타겟·케이스는 버튼을 눌러 펼치고, 케이스를 누르면 상세가 열려요. 확정 기준은 회차 confirmed, 대상자·케이스 evaluated예요.</p>
      ${pills ? `<div class="status-pills">${pills}</div>` : ""}
    </div>
    <div class="tree-scroll"><div class="tree-inner">
      <div class="thead"><span>항목</span><span>상태</span><span>대상</span><span>미완 대상</span><span>케이스</span><span>미완 케이스</span><span></span></div>
      ${rows.join("") || `<div class="empty">${esc(emptyLabel)}</div>`}
    </div></div>
  </div>`;
}

function renderApp() {
  const data = DATA[state.month];
  const tree = state.scope === "all" ? data.tree : filterOpenTree(data.tree);
  const treeData = { ...data, tree };
  const emptyLabel = state.scope === "open" ? "이 달에 미확정 평가가 없어요" : "이 달에 표시할 평가가 없어요";
  document.getElementById("app").innerHTML = `
    <p class="kicker">품질평가</p>
    <h1>평가 현황</h1>
    <p class="lede">월별 평가표·대상·케이스 진행 상태를 봐요. 기본은 당월이고, 과거 월도 고를 수 있어요.</p>
    <div class="callout">
      <strong>UI 레퍼런스 · 샘플 데이터</strong>
      <span>서버·로그인·인터넷 없이 이 파일만 열면 됩니다. 평가월·미확정/전체·트리 펼침·케이스 팝업을 그대로 써 보세요.</span>
    </div>
    <div class="filters">
      <label class="field">
        <span>평가월</span>
        <select id="month">
          ${MONTHS.map((m) => `<option value="${m}" ${m === state.month ? "selected" : ""}>${m}</option>`).join("")}
        </select>
      </label>
      <div class="field">
        <span>보기</span>
        <div class="chips">
          <button type="button" class="chip" data-scope="open" aria-pressed="${state.scope === "open"}">미확정</button>
          <button type="button" class="chip" data-scope="all" aria-pressed="${state.scope === "all"}">전체</button>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><label>회차</label><b>${data.openEvalCount}/${data.evalCount}</b></div>
      <div class="stat"><label>미확정 회차</label><b>${data.openEvalCount}</b></div>
      <div class="stat"><label>대상</label><b>${data.openTargetCount}/${data.targetCount}</b></div>
      <div class="stat"><label>미완료 대상</label><b>${data.openTargetCount}</b></div>
      <div class="stat"><label>케이스</label><b>${data.openCaseCount}/${data.caseCount}</b></div>
      <div class="stat"><label>미완료 케이스</label><b>${data.openCaseCount}</b></div>
    </div>
    ${renderTree(treeData, emptyLabel)}
    <p class="note">QRadar 평가 현황 화면 레퍼런스 · 샘플이며 실제 평가 데이터가 아닙니다.</p>
  `;
  bindApp();
  renderDialog();
}

function contentHtml(content) {
  if (content && typeof content === "object") {
    return Object.entries(content).map(([k, v]) => `<div class="kv"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
  }
  return `<p>${esc(content || "(내용 없음)")}</p>`;
}

function renderDialog() {
  const overlay = document.getElementById("overlay");
  const id = state.caseId;
  overlay.classList.toggle("open", Boolean(id));
  if (!id) return;
  const row = CASES[id] || {
    title: `케이스 ${id}`, team: "샘플", result: "hot", status: "pending",
    cold: false, wrong: false, memo: "", content: "레퍼런스용 샘플 케이스입니다. 실제 상담 내용은 없어요.",
  };
  const badges = [
    row.cold ? `<span class="badge warn">Cold</span>` : `<span class="badge ok">${esc(row.result || "—")}</span>`,
    row.wrong ? `<span class="badge warn">오답</span>` : "",
    row.memo ? `<span class="pill" style="background:#eaf3ff;color:#1c7ed6">메모</span>` : "",
    `<span class="badge warn" style="color:#6a6a67;box-shadow:inset 0 0 0 1px #eaeae8">${esc(row.status)}</span>`,
    `<span style="font-size:11px;color:var(--fg-tertiary)">${esc(row.team)}</span>`,
  ].join("");
  document.getElementById("dialog").innerHTML = `
    <h2>${esc(row.title)}</h2>
    <p class="desc">케이스 상세와 같은 내용이에요.</p>
    <div class="card">
      <div class="card-top"><b>${esc(row.title)}</b>${badges}</div>
      <div class="block"><div class="ttl">문의 / 케이스 내용</div>${contentHtml(row.content)}</div>
      ${row.wrong
        ? `<div class="block wrong"><div class="ttl">오답 항목</div><p>${esc(row.wrong)}</p></div>`
        : `<p style="font-size:12px;color:var(--fg-tertiary)">오답 항목 없음</p>`}
      ${row.memo ? `<div class="block"><div class="ttl">메모</div><p>${esc(row.memo)}</p></div>` : ""}
      ${row.scores ? `<div class="raw"><button type="button" data-raw>원본 case_scores <span>원본</span></button><pre hidden>${esc(JSON.stringify(row.scores, null, 2))}</pre></div>` : ""}
    </div>
    <div class="dialog-foot"><button class="ghost" type="button" id="close-dialog">닫기</button></div>
  `;
  document.getElementById("close-dialog").onclick = () => { state.caseId = null; renderDialog(); };
  const rawBtn = document.querySelector("[data-raw]");
  if (rawBtn) rawBtn.onclick = () => {
    const pre = rawBtn.nextElementSibling;
    const open = !pre.hidden;
    pre.hidden = open;
    rawBtn.querySelector("span").textContent = open ? "원본" : "접기";
  };
}

function bindApp() {
  document.getElementById("month").onchange = (e) => {
    state.month = e.target.value;
    resetExpand();
    state.caseId = null;
    renderApp();
  };
  document.querySelectorAll("[data-scope]").forEach((btn) => {
    btn.onclick = () => { state.scope = btn.dataset.scope; renderApp(); };
  });
  document.querySelectorAll("[data-toggle]").forEach((el) => {
    el.onclick = () => {
      const id = el.dataset.toggle;
      state.expanded[id] = state.expanded[id] === false;
      renderApp();
    };
  });
  document.querySelectorAll("[data-sheet]").forEach((btn) => {
    btn.onclick = (e) => {
      e.stopPropagation();
      state.openSheets[btn.dataset.sheet] = !state.openSheets[btn.dataset.sheet];
      renderApp();
    };
  });
  document.querySelectorAll("[data-target]").forEach((btn) => {
    btn.onclick = (e) => {
      e.stopPropagation();
      state.openTargets[btn.dataset.target] = !state.openTargets[btn.dataset.target];
      renderApp();
    };
  });
  document.querySelectorAll("[data-case]").forEach((el) => {
    el.onclick = () => { state.caseId = el.dataset.case; renderDialog(); };
  });
}

document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") { state.caseId = null; renderDialog(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.caseId) { state.caseId = null; renderDialog(); }
});

renderApp();
</script>
</body>
</html>
